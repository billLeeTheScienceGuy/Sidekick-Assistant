name: Android foundation
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/prepare_speech.py --compact
      - run: python scripts/prepare_speaker.py
      - run: python scripts/prepare_diarization.py
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: text-understanding-evaluation
          path: core/build/reports/accuracy.md
          retention-days: 7
